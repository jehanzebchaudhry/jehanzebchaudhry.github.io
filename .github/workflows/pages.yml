# Builds the website and publishes it to GitHub Pages on every push to main.
# Step 1 turns papers.bib into the publication lists; step 2 is GitHub's
# standard Jekyll build. Repository setting needed once:
# Settings -> Pages -> Source: GitHub Actions.

name: Build and deploy site

on:
  push:
    branches: [main, bib-build]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate publication lists from papers.bib
        run: |
          pip install pybtex pyyaml
          python scripts/bib2yaml.py

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
